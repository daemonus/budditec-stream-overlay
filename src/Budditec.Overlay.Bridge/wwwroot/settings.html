<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Budditec Overlay - Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <form id="form" autocomplete="off">
    <section>
      <h2>Connections</h2>
      <label>Twitch channel <input data-path="twitch.channel" placeholder="channel name or twitch.tv URL"></label>
      <label>Kick channel <input data-path="kick.channel" placeholder="channel name or kick.com URL"></label>
      <label>YouTube channel <input data-path="youTube.channel" placeholder="@handle, channel id or video URL"></label>
      <label>OBS WebSocket URL <input data-path="obs.url" placeholder="ws://127.0.0.1:4455"></label>
      <label>OBS password <input type="password" data-path="obs.password" placeholder="blank if auth is off"></label>
    </section>

    <section>
      <h2>Widgets</h2>
      <div id="widgets"></div>
    </section>

    <section>
      <h2>Chat text</h2>
      <label>Font <input data-path="chatStyle.fontFamily" list="fonts"></label>
      <datalist id="fonts"></datalist>
      <label>Size <input type="number" data-path="chatStyle.fontSize" min="6" max="200" step="1"></label>
      <label>Weight
        <select data-path="chatStyle.fontWeight" data-number>
          <option>300</option><option>400</option><option>500</option><option>600</option>
          <option>700</option><option>800</option><option>900</option>
        </select>
      </label>
      <label>Text colour <span class="color"><input data-path="chatStyle.textColor"><input type="color"></span></label>
      <label>Emote size <input type="number" data-path="chatStyle.emoteScale" min="0.25" max="8" step="0.1"></label>
      <label>Max messages <input type="number" data-path="chatStyle.maxMessages" min="1" max="1000" step="5"></label>
      <label>Fade after (s) <input type="number" data-path="chatStyle.fadeAfterSeconds" min="0" step="5" placeholder="0 = never"></label>
      <div id="preview">Budditec: font preview Kappa 123</div>
    </section>

    <section>
      <h2>Names</h2>
      <label class="check"><input type="checkbox" data-path="chatStyle.usePlatformNameColors"> Colour names by platform (otherwise the user's own colour)</label>
      <label>Twitch <span class="color"><input data-path="chatStyle.platformColors.Twitch"><input type="color"></span></label>
      <label>Kick <span class="color"><input data-path="chatStyle.platformColors.Kick"><input type="color"></span></label>
      <label>YouTube <span class="color"><input data-path="chatStyle.platformColors.YouTube"><input type="color"></span></label>
      <label class="check"><input type="checkbox" data-path="chatStyle.showPlatformIcon"> Show platform icon</label>
    </section>

    <section>
      <h2>Drop shadow</h2>
      <label class="check"><input type="checkbox" data-path="chatStyle.shadowEnabled"> Enabled</label>
      <label>Colour <span class="color"><input data-path="chatStyle.shadowColor"><input type="color"></span></label>
      <label>Blur <input type="number" data-path="chatStyle.shadowBlur" min="0" max="20" step="1"></label>
      <label>Offset <input type="number" data-path="chatStyle.shadowOffsetX" min="-10" max="10" step="1"></label>
    </section>

    <section>
      <h2>Microphones (from OBS)</h2>
      <p id="scene" class="hint">Connecting to OBS</p>
      <div id="sources"></div>
      <label>Speaking above (dB) <input type="number" data-path="audio.speakingThresholdDb" min="-90" max="0" step="1"></label>
    </section>

    <footer>
      <span id="message"></span>
      <button type="button" id="test">Send test message</button>
      <button type="submit" class="accent">Apply</button>
    </footer>
  </form>
  <script type="module" src="settings.js"></script>
</body>
</html>
